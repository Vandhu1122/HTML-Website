<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Web Development Learning Hub</title>
    <meta name="description" content="Register a new account on Web Development Learning Hub.">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/images/logo1.jpg" alt="Web Development Learning Hub Logo" width="40" height="40">
                <span>Web Learning Hub</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="assignments.html">Assignments</a>
                <a href="about.html">About</a>
                <a href="media.html">Media</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="card form-container">
            <h1>Create an Account</h1>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Fill in your details to create a new profile.</p>

            <form action="#" method="get">
                <div class="form-group">
                    <label for="new-username">Username</label>
                    <input type="text" id="new-username" name="username" class="form-control" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="new-email">Email Address</label>
                    <input type="email" id="new-email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" name="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label for="gender-male">
                            <input type="radio" id="gender-male" name="gender" value="male" checked> Male
                        </label>
                        <label for="gender-female">
                            <input type="radio" id="gender-female" name="gender" value="female"> Female
                        </label>
                        <label for="gender-other">
                            <input type="radio" id="gender-other" name="gender" value="other"> Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role-select">Select Role</label>
                    <select id="role-select" name="role" class="form-control" required>
                        <option value="">-- Choose your role --</option>
                        <option value="student">Student / Learner</option>
                        <option value="instructor">Instructor</option>
                        <option value="developer">Developer</option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="terms-agree" name="terms" required>
                    <label for="terms-agree" style="font-weight: normal; margin-bottom: 0;">I agree to the terms and conditions</label>
                </div>

                <button type="submit" class="btn-primary">Register Account</button>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Web Development Learning Hub. All rights reserved.</p>
    </footer>
</body>

</html>
