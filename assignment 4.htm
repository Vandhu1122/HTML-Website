<!-- how to use in span -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span example</title>
</head>

<body>
    <div style="background-color: red;"> Hello <span style="background-color: green;">World</span> </div>
    <span style="background-color: yellow;"> Hello <p style="background-color: blue;">World</p> </span>
</body>

</html>
